<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ConvoMoor 本机 AI</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif;font-size:12px}body{margin:0;padding:8px;color:CanvasText;background:Canvas}button{font:inherit;border:1px solid #9ebd76;border-radius:6px;padding:5px 9px;cursor:pointer;background:#a7c95726;color:inherit}button:disabled{cursor:default;opacity:.6}p{margin:6px 0;line-height:1.45}#status{overflow-wrap:anywhere}small{opacity:.72;line-height:1.4;display:block}progress{width:100%;height:6px}select{font:inherit;margin-left:4px;max-width:90px}label{margin-right:6px}
</style><script src="src/local-ai.js" defer></script></head>
<body><button id="enable" type="button">启用本机 AI</button><label>语言<select id="language" aria-label="本机模型语言"><option value="en">English</option><option value="ja">日本語</option><option value="es">Español</option><option value="de">Deutsch</option><option value="fr">Français</option></select></label>
<p id="status" role="status" aria-live="polite">尚未启用；不会自动创建模型或下载。</p><progress id="download" max="1" value="0" hidden></progress>
<small>点击启用可能由 Chrome 下载本机模型，下载大小取决于浏览器；生成内容不发送至云端。浏览器、硬件和页面权限必须支持 Prompt API；当前配置不保证中文能力。不支持时可使用主输入框草稿。</small></body></html>
