<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ConvoMoor 云端 API 设置</title><link rel="stylesheet" href="options.css"><script src="src/cloud.js" defer></script><script src="src/options.js" defer></script></head>
<body><main>
  <header><h1>云端 API 设置</h1><button id="close" type="button" aria-label="关闭 API 设置" title="关闭设置并返回">×</button></header>
  <p>支持 OpenAI Chat Completions 兼容接口。只有主动提问才发送引用、问题和侧聊上下文；保存设置不会调用模型。</p>
  <form id="api-form" novalidate><fieldset id="fields" disabled>
    <label for="base">API 基础地址</label><input id="base" type="url" placeholder="例如 https://openrouter.ai/api/v1" autocomplete="off">
    <label for="model">模型名称</label><input id="model" placeholder="填写服务商提供的准确模型名" autocomplete="off">
    <label for="key">API Key</label><input id="key" type="password" placeholder="只在此页填写 API Key" autocomplete="off" aria-describedby="key-help">
    <p id="key-help">已保存的 Key 不回显，留空会保留原 Key。API 地址和模型名会自动读取，无需每次重新配置。</p>
    <div class="actions"><button id="save" type="submit">保存并授权此域名</button><button id="clear" type="button">清除云端配置与 Key</button></div>
  </fieldset></form>
  <p id="status" role="status" aria-live="polite">正在读取已保存配置…</p><button id="retry" type="button" hidden>重试读取</button>
  <p class="privacy">Key 保存在此扩展的本地存储，不进入聊天备份、网页或诊断。各安装副本独立保存配置；更换目录安装可能需要重新配置。费用与限额由 API 提供商决定。</p>
</main></body></html>
