<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ConvoMoor 云端 API 设置</title><link rel="stylesheet" href="options.css"><script src="src/cloud.js" defer></script><script src="src/options.js" defer></script></head><body><main><h1>云端 API 设置</h1><p>支持 OpenAI Chat Completions 兼容接口。只有你在侧聊中点击“提问”才发送引用、侧聊上下文和问题；不会自动上传完整聊天历史。</p><label>API 基础地址<input id="base" type="url" placeholder="例如 https://openrouter.ai/api/v1" autocomplete="off"></label><label>模型名称<input id="model" placeholder="填写服务商提供的准确模型名" autocomplete="off"></label><label>API Key<input id="key" type="password" placeholder="只在此页填写；留空保留原Key" autocomplete="off"></label><p>Key 保存在此扩展的本地存储，不进入聊天资料备份、网页内容或诊断报告。保存时仅申请填写的API域名权限。费用与限额由你的服务商决定。</p><button id="save">保存并授权此域名</button><button id="clear">清除云端配置与 Key</button><p id="status" role="status"></p></main></body></html>
